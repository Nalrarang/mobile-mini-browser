<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Mini Browser</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <!-- 로딩 스크린 (초기에만 표시) -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <h1>Mobile Mini Browser</h1>
        <p>Responsive web preview</p>
        <div class="spinner"></div>
      </div>
    </div>

    <!-- 상단 툴바 (상시 노출) -->
    <div class="toolbar" id="toolbar">
      <button id="nav-back" class="tb-btn" title="뒤로">←</button>
      <button id="nav-forward" class="tb-btn" title="앞으로">→</button>
      <button id="nav-reload" class="tb-btn" title="새로고침">⟳</button>
      <button id="url-toggle" class="tb-btn" title="주소 입력">🔗</button>
      <input id="toolbar-url" class="toolbar-url" type="url" placeholder="https://..." autocomplete="off" />
      <span class="tb-spacer"></span>
      <button id="aot-btn" class="tb-btn active" title="항상 위">📌</button>
      <button id="new-window-btn" class="tb-btn" title="새 창">➕</button>
      <button id="menu-toggle" class="tb-btn" title="설정">⚙️</button>
    </div>

    <!-- 분할 뷰 컨테이너 -->
    <div class="split-container">
      <!-- 좌측 컨트롤 패널 (슬라이드) -->
      <div class="control-panel" id="control-panel">
        <div class="panel-header">
          <h2>WebView Controller</h2>
          <button id="menu-close" class="menu-close">×</button>
        </div>

        <div class="panel-content">
          <div class="form-section">
            <h3>URL Settings</h3>
            <form id="webview-form">
              <div class="default-url-info">
                <span class="default-url-label">Start Default URL:</span>
                <span id="default-url-display" class="default-url-value">Not set</span>
              </div>      

              <div class="input-group">
                <input
                  id="url-input"
                  type="url"
                  placeholder="https://example.com"
                  required
                />
              </div>

              <div class="device-section">
                <h4>Device</h4>
                <select id="device-select" class="device-select"></select>
                <div class="custom-device">
                  <input id="custom-name" type="text" placeholder="Name" />
                  <input id="custom-width" type="number" placeholder="W" />
                  <input id="custom-height" type="number" placeholder="H" />
                </div>
                <button type="button" id="add-preset-btn" class="secondary-btn">＋ Add preset</button>
              </div>
              <div class="default-url-section">
                <button type="button" id="set-default-url-btn" class="secondary-btn">
                  Set as Default URL
                </button>
                <button type="button" id="clear-default-url-btn" class="secondary-btn">
                  Clear URL
                </button>
              </div>
              <button type="submit">Navigate to URL</button>
            </form>
          </div>

          <div class="quick-actions">
            <h3>Quick Actions</h3>
            <button id="default-url-btn">Load Default URL</button>
          </div>

        </div>
      </div>

      <!-- 우측 웹뷰 영역 (Tauri가 여기에 웹뷰를 삽입) -->
      <div class="webview-container" id="webview-container">
        <!-- Tauri webview will be rendered here -->
      </div>
    </div>
  </body>
</html>
